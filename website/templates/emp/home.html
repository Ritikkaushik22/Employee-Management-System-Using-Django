<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #1c1c1c, #2e2e2e);
      color: #f8f9fa;
    }

    .navbar {
      background-color: #111 !important;
    }

    .navbar-brand,
    .nav-link,
    .dropdown-item {
      color: #f8f9fa !important;
    }

    .navbar-toggler {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .dropdown-menu {
      background-color: #222;
    }

    .dropdown-item:hover {
      background-color: #333;
    }

    h1 {
      color: #fff;
      text-align: center;
      margin: 20px 0;
    }

    .card {
      background-color: #2a2a2a;
      border: none;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .table thead {
      background-color: #444;
      color: #fff;
    }

   

    .table tbody tr {
      color: #e0e0e0; 
    }

    .btn-danger {
      background-color: #dc3545;
    }

    .btn-dark {
      background-color: #343a40;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .container {
      padding-bottom: 50px;
    }
  </style>
</head>
<body>

{% include 'emp/navbar.html' %}
  <!-- Page Content -->
  <h1>Employee Management</h1>
  <h1>List of Employees</h1>

  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-body">
            <table class="table">
              <thead>
                <tr>
                  <th>#SNO.</th>
                  <th>NAME</th>
                  <th>EMP ID</th>
                  <th>PHONE</th>
                  <th>WORKING</th>
                  <th>DEPARTMENT</th>
                  <th>ADDRESS</th>
                  <th>ACTION</th>
                </tr>
              </thead>
              <tbody>
                {% for e in emps %}
                <tr>
                  <td>{{ forloop.counter }}</td>
                  <td>{{ e.name }}</td>
                  <td>{{ e.emp_id }}</td>
                  <td>{{ e.phone }}</td>
                  <td>{{ e.working }}</td>
                  <td>{{ e.department }}</td>
                  <td>{{ e.address }}</td>
                  <td>
                    <a href="/employee/delete-emp/{{ e.id }}" class="btn btn-danger btn-sm">Delete</a>
                    <a href="/employee/update-emp/{{ e.id }}" class="btn btn-dark btn-sm">Update</a>
                  </td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
