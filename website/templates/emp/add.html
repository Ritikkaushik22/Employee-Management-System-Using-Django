<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add New Employee</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #1c1c1c, #2e2e2e);
      color: #f8f9fa;
      font-family: 'Segoe UI', sans-serif;
    }
    .navbar {
        background-color: #111 !important;
      }
  
      .navbar-brand,
      .nav-link,
      .dropdown-item {
        color: #f8f9fa !important;
      }
  
      .navbar-toggler {
        border-color: rgba(255, 255, 255, 0.2);
      }
  
      .dropdown-menu {
        background-color: #222;
      }
  
      .dropdown-item:hover {
        background-color: #333;
      }
  
    h1 {
      color: #ffffff;
      text-align: center;
      margin-top: 30px;
      margin-bottom: 30px;
    }

    .card {
      background-color: #2a2a2a;
      border: none;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    label {
      font-weight: 500;
    }

    .form-control,
    .form-check-input,
    select {
      background-color: #1e1e1e;
      color: #ffffff;
      border: 1px solid #444;
    }

    .form-control::placeholder {
      color: #bbb;
    }

    .btn-primary {
      background-color: #007bff;
      border-color: #007bff;
      transition: background-color 0.2s ease;
    }

    .btn-primary:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  {% include 'emp/navbar.html' %}

  <h1>ADD NEW EMPLOYEE</h1>

  <div class="container">
    <div class="row">
      <div class="col-md-6 offset-md-3">
        <div class="card">
          <div class="card-body">
            <form action="/employee/add-emp/" method="POST">
              {% csrf_token %}
              <div class="mb-3">
                <label for="name">Employee Name</label>
                <input type="text" class="form-control" id="name" name="emp_name" placeholder="Enter Emp Name">
              </div>

              <div class="mb-3">
                <label for="emp_id">Employee ID</label>
                <input type="text" class="form-control" id="emp_id" name="emp_id" placeholder="Employee ID">
              </div>

              <div class="mb-3">
                <label for="emp_phone">Employee Phone</label>
                <input type="tel" class="form-control" id="emp_phone" name="emp_phone" placeholder="Employee Phone">
              </div>

              <div class="mb-3">
                <label for="address">Employee Address</label>
                <textarea id="address" name="emp_add" class="form-control" rows="4" placeholder="Enter Address"></textarea>
              </div>

              <div class="mb-3 form-check">
                <input id="working" type="checkbox" class="form-check-input" name="emp_working">
                <label for="working" class="form-check-label">Currently Working</label>
              </div>

              <div class="mb-3">
                <label for="department">Employee Department</label>
                <select id="department" class="form-control" name="emp_department">
                  <option value="CSE">Computer Science</option>
                  <option value="ME">Mechanical</option>
                  <option value="EE">Electrical Engineering</option>
                </select>
              </div>

              <div class="text-center">
                <button type="submit" class="btn btn-primary">Add Employee</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
