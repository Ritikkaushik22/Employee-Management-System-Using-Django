<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Update</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #1c1c1c, #2e2e2e);
      color: #f8f9fa;
      font-family: 'Segoe UI', sans-serif;
    }

    .navbar {
      background-color: #111 !important;
    }

    .navbar-brand,
    .nav-link,
    .dropdown-item {
      color: #f8f9fa !important;
    }

    .navbar-toggler {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .dropdown-menu {
      background-color: #222;
    }

    .dropdown-item:hover {
      background-color: #333;
    }

    h1 {
      color: #ffffff;
      text-align: center;
      margin-top: 30px;
      margin-bottom: 30px;
    }

    .card {
      background-color: #2a2a2a;
      border: none;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    label {
      font-weight: 500;
    }

    .form-control,
    .form-check-input,
    select {
      background-color: #1e1e1e;
      color: #ffffff;
      border: 1px solid #444;
    }

    .form-control::placeholder {
      color: #bbb;
    }

    .btn-success {
      background-color: #28a745;
      border-color: #28a745;
      transition: background-color 0.2s ease;
    }

    .btn-success:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

{% include 'emp/navbar.html' %}

  <!-- Form Heading -->
  <h1>UPDATE EMPLOYEE</h1>

  <!-- Form -->
  <div class="container">
    <div class="row">
      <div class="col-md-6 offset-md-3">
        <div class="card">
          <div class="card-body">
            <form action="/employee/do-update-emp/{{ emp.id }}" method="POST">
              {% csrf_token %}
              <div class="mb-3">
                <label for="name">Employee Name</label>
                <input type="text" class="form-control" id="name" name="emp_name" placeholder="Enter Emp Name" value="{{ emp.name }}">
              </div>

              <div class="mb-3">
                <label for="emp_id">Employee ID</label>
                <input type="text" class="form-control" id="emp_id" name="emp_id" placeholder="Employee ID" value="{{ emp.emp_id }}">
              </div>

              <div class="mb-3">
                <label for="emp_phone">Employee Phone</label>
                <input type="tel" class="form-control" id="emp_phone" name="emp_phone" placeholder="Employee Phone" value="{{ emp.phone }}">
              </div>

              <div class="mb-3">
                <label for="address">Employee Address</label>
                <textarea id="address" name="emp_add" class="form-control" rows="4" placeholder="Enter Address">{{ emp.address }}</textarea>
              </div>

              <div class="mb-3 form-check">
                <input {% if emp.working %} checked {% endif %} id="working" type="checkbox" class="form-check-input" name="emp_working">
                <label for="working" class="form-check-label">Currently Working</label>
              </div>

              <div class="mb-3">
                <label for="department">Employee Department</label>
                <select id="department" class="form-control" name="emp_department">
                  <option value="CSE" {% if emp.department == 'CSE' %} selected {% endif %}>Computer Science</option>
                  <option value="ME" {% if emp.department == 'ME' %} selected {% endif %}>Mechanical</option>
                  <option value="EE" {% if emp.department == 'EE' %} selected {% endif %}>Electrical Engineering</option>
                </select>
              </div>

              <div class="text-center">
                <button type="submit" class="btn btn-success">Update Employee</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
